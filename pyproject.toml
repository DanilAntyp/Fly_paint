[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flypaint"
version = "0.1.0"
description = "Data preparation for a connectome-derived drawing agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pyarrow>=15,<30"]

[tool.setuptools.packages.find]
where = ["src"]
